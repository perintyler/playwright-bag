name: browser
description: Web browsing and browser automation

# ONE @playwright/mcp server, deliberately.
#
# Session tool filtering resolves traits to a Set of bare tool NAMES, and every
# @playwright/mcp instance exports the same 24 `browser_*` names. A second
# Playwright server — in this bag or a sibling one — therefore survives a trait
# filter meant for this one, and the model sees every browser tool twice with no
# way to tell the two apart. Verified live: a session traited `browser-headless`
# received 48 tools from both namespaces.
#
# So headless-vs-headed is a per-run flag, not a second server. `--isolated`
# keeps each run on a fresh profile; for the user's real logins use the
# `browser-mine` bag, whose vocabulary is distinct and so can coexist.
mcp-servers:
  browser:
    command: npx
    args: ["-y", "@playwright/mcp@0.0.78", "--headless", "--isolated"]
    # A browser tab is state. Without this every Barry session shares one
    # connection and therefore one tab, so a concurrent session can navigate
    # the page out from under you mid-task.
    session-scoped: true

# Composes browser-mine so one `browser` grant covers both the clean headless
# profile and the user's real logged-in Chrome. Safe from the double-listing
# problem described above precisely because the vocabularies are disjoint
# (browser_navigate/browser_snapshot vs navigate_page/take_snapshot), so a
# trait filter cannot confuse the two servers' tools.
#
# TRADEOFF, deliberate: this makes the safe-sounding `browser` trait also carry
# real-Chrome access, which can see every open tab (email, banking, work) and
# act as the logged-in user. Picking `browser` for a throwaway page fetch now
# grants that too. Chosen for convenience over a second checkbox; if that ever
# feels too broad, delete the `bags:` block and install browser-mine on the
# identity instead, which puts it back behind its own explicit grant.
bags:
  - browser-mine

dependencies:
  - name: npx
    reason: runs the browser MCP server
  - name: node
    reason: required by npx

traits:
  browser:
    description: Web browsing — headless, plus the user's real logged-in Chrome
    access: readwrite
    # Both namespaces listed explicitly. A manifest trait that reuses the
    # auto-trait's name REPLACES it (see getAllTraits in @barry/bags), so the
    # `bags:` composition above does NOT reach this trait on its own — without
    # browser-mine spelled out here the grant silently stays headless-only.
    namespaces: [browser, browser-mine]
    skills: [web-browsing, real-chrome-setup]
